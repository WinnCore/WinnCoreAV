# WinnCore AV - Hardened build configuration
# Enables exploit mitigations where the Rust toolchain supports them.

# Cargo takes rustflags from build.rustflags OR from the matching [target.*]
# entries, never both. Under [build], these were silently dropped on aarch64,
# which has its own [target.aarch64-*] section below. Matching [target.cfg]
# and [target.<triple>] entries are joined, so these reach every Linux
# target, including aarch64.
[target.'cfg(target_os = "linux")']
rustflags = [
    # Exploit mitigations
    "-C", "overflow-checks=on",
    "-C", "relocation-model=pic",
    "-C", "link-arg=-Wl,-z,relro",
    "-C", "link-arg=-Wl,-z,now",
    "-C", "link-arg=-Wl,-z,noexecstack",
]
# Left out on purpose. These used to be passed to rustc as link args, where
# they did nothing for Rust code:
# - -fstack-clash-protection: rustc already emits inline stack probes on
#   x86_64 and aarch64 Linux by default.
# - -D_FORTIFY_SOURCE: a C preprocessor define, so it can't apply to Rust.
# - -mbranch-protection (PAC/BTI): needs codegen support, which for Rust is
#   still nightly-only (-Zbranch-protection=bti,pac-ret). A linker flag
#   can't add it.

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
debug = false
strip = "symbols"

[profile.release.package."*"]
opt-level = 3

[profile.release-with-debug]
inherits = "release"
debug = true
strip = "none"

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

[target.aarch64-unknown-linux-musl]
linker = "aarch64-linux-musl-gcc"
rustflags = [
    "-C", "target-feature=+crt-static",
]

[target.aarch64-apple-darwin]
rustflags = [
    "-C", "link-arg=-Wl,-dead_strip",
]
