name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    # GitHub-hosted ARM64 label is ubuntu-24.04-arm (no "64"). The old label
    # matched no runner, so every job sat queued for 24h and got cancelled.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # libclang for bindgen (yara-sys, librocksdb-sys), libssl for openssl-sys.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev libssl-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-arm64-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build
        run: cargo build --release --workspace
      
      - name: Test
        run: cargo test --workspace
      
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
      
      - name: Format check
        run: cargo fmt --all -- --check
