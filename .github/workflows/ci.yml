name: Production CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [ x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu ]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked
      - name: Build
        run: cross build -p av-cli --target ${{ matrix.target }} --release
      - name: Test
        run: cross test --all --target ${{ matrix.target }}

  eicar-detection:
    name: EICAR Integration Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-eicar-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build release
        run: cargo build -p av-cli --release
      - name: Create EICAR file safely
        run: |
          mkdir -p /tmp/av-test
          # base64 encoded EICAR to avoid triggering repo scanners
          echo 'WDVPIVAlQEFQWzRcUFpYNTQoUF4pN0NDKTd9JUVJQ0FSLVNUQU5EQVJELUFOVElWSVJVUy1URVNULUZJTEUhJEgrSCo=' \
            | base64 -d > /tmp/av-test/eicar.com
      - name: Scan EICAR
        run: |
          QUARANTINE_DIR=/tmp/av-quarantine \
          ./target/release/av-cli scan /tmp/av-test/eicar.com > scan_output.txt || true
          cat scan_output.txt
      - name: Verify detection
        run: |
          grep -E -q 'EICAR|THREAT|MALWARE|Quarantine' scan_output.txt
      - name: Upload scan results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scan-results
          path: scan_output.txt

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-audit-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install cargo-audit and cargo-deny
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked
      - name: cargo audit
        run: cargo audit
      - name: cargo deny
        run: cargo deny check

  benchmark:
    name: Performance Baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-bench-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build release
        run: cargo build -p av-cli --release
      - name: Create test files
        run: |
          mkdir -p /tmp/bench
          for i in $(seq 1 100); do
            dd if=/dev/urandom of=/tmp/bench/file$i.bin bs=1M count=1 status=none
          done
      - name: Benchmark scan
        run: |
          /usr/bin/time -f 'elapsed=%E maxrss_kb=%M' ./target/release/av-cli scan /tmp/bench | tee bench_output.txt
      - name: Publish bench artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bench-output
          path: bench_output.txt
