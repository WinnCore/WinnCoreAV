name: CI (ARM64 Only)

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Force vendored YARA on ARM64 - no pkg-config
  YARA_NO_PKG_CONFIG: 1
  PKG_CONFIG_ALLOW_CROSS: 0

jobs:
  build-test:
    name: Build & Test (ARM64)
    # For self-hosted ARM64 runner:
    runs-on: ubuntu-latest
    # OR if you're using a service with ARM64 runners:
    # runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install ARM64 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config autoconf automake libtool bison flex libssl-dev
          echo "✓ ARM64 dependencies installed"

      - name: Verify ARM64 architecture
        run: |
          echo "Architecture: $(uname -m)"
          [ "$(uname -m)" = "aarch64" ] && echo "✓ Running on ARM64" || echo "⚠ Not ARM64!"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy (ARM64)
        run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings

      - name: Build (ARM64 vendored YARA)
        run: cargo build --release --locked --verbose

      - name: Run tests (ARM64)
        run: cargo test --workspace --all-features --locked -- --nocapture

      - name: Print YARA version (ARM64)
        run: |
          cargo test print_yara_version_arm64 -- --nocapture --exact || echo "No version test found"

      - name: Security audit
        run: cargo audit || true
        continue-on-error: true
