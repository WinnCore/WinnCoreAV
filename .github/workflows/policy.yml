name: Policy Enforcement

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  secrets-scan:
    name: Secrets Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  license-audit:
    name: License & Advisory Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Check advisories
        run: cargo deny check advisories
      - name: Check licenses
        run: cargo deny check licenses
      - name: Check bans
        run: cargo deny check bans

  pattern-blocks:
    name: GPL & EICAR Pattern Blocking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Block GPL headers
        run: |
          if rg --type rust --type yaml --type toml --type md \
            'GNU GENERAL PUBLIC LICENSE|GNU Lesser General Public|GNU AFFERO GENERAL PUBLIC LICENSE' .; then
            echo "❌ GPL license text detected in repository"
            exit 1
          fi
          echo "✅ No GPL headers found"
      - name: Block raw EICAR pattern
        run: |
          if rg --type rust --type yaml --type sh --type md \
            'X5O.*P%.*@AP.*\[4.*PZX' .; then
            echo "❌ Raw EICAR-like pattern detected"
            echo "Use base64 encoding for test artifacts"
            exit 1
          fi
          echo "✅ No raw EICAR patterns found"

  spdx-headers:
    name: SPDX Header Check (Advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Check SPDX presence
        run: |
          echo "TODO: Implement reuse lint or custom SPDX scanner"
