name: Self-Healing CI

on:
  # Manual only until it's set up: autofix-ci/action requires this workflow
  # to be named "autofix.ci" and the autofix.ci app to be installed, so on
  # push/schedule it failed every run.
  workflow_dispatch:

jobs:
  autofix:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Auto-fix formatting
        run: cargo fmt --all

      - name: Auto-fix lints
        run: cargo clippy --fix --workspace --allow-dirty --all-targets -- -D warnings

      - uses: autofix-ci/action@v1

  full-validation:
    needs: autofix
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Run Autonomous Validation (fast)
        run: WINNCORE_VALIDATION_MODE=fast ./scripts/autonomous-validation.sh
