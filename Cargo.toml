[workspace]
resolver = "2"
members = [
    "av-core",
    "av-signatures", 
    "av-daemon",
    "av-cli",
    "av-quarantine", "winncore-monitor", "av-watchdog", "av-ebpf", "av-ebpf-loader",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["WinnCore Team"]
license = "MIT"
repository = "https://github.com/WinnCore/WinnCoreAV"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.21"
bloom = "0.3"
bytes = "1.10"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
config = "0.14"
ed25519-dalek = "2.1"
goblin = "0.8"
hex = "0.4"
indicatif = "0.17"
landlock = "0.4"
parking_lot = "0.12"
rand = "0.8"
rayon = "1.10"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"] }
ring = "0.17"
seccomp = "0.1"
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = { version = "3.11", features = ["hex"] }
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.42", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3.18", features = ["fmt", "env-filter"] }
url = "2.5"
walkdir = "2.5"
yara = { version = "0.23.0", default-features = false, features = ["vendored", "bindgen"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
