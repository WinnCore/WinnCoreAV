[workspace]
members = [
    "av-core",
    "av-cli", 
    "av-daemon",
    "av-quarantine",
    "av-signatures",
]

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.21"
bloom = "0.3"
bytes = "1.10"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
config = "0.14"
dirs = "5.0"
env_logger = "0.11"
libc = "0.2"
log = "0.4"
nix = { version = "0.29", features = ["fs"] }
notify = "6.1"
rand = "0.8"
regex = "1.11"
ring = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.42", features = ["full"] }
toml = "0.8"
yara = "0.28"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
