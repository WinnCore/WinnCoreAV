[package]
name = "av-arm64-hw"
version = "0.1.0"
edition = "2021"
description = "ARM64 hardware security feature monitoring for WinnCore EDR"
publish = false

[dependencies]
libc = "0.2"
nix = { version = "0.27", features = ["process", "signal"] }
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
