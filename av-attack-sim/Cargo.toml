[package]
name = "av-attack-sim"
version = "0.1.0"
edition = "2021"
authors.workspace = true
license.workspace = true
description = "Fast attack simulation for WinnCore EDR validation"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/av-attack-sim"
readme = "README.md"
keywords = ["security", "edr", "arm64", "antivirus", "simulation"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[[bin]]
name = "attack-sim"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full", "process", "time", "sync", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
colored = "2"
nix = { version = "0.27", features = ["process", "signal"] }
libc = "0.2"
futures = "0.3"
