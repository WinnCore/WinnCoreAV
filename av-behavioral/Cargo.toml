[package]
name = "av-behavioral"
version = "0.1.0"
edition = "2021"
description = "Behavioral detection rules engine for WinnCore"
publish = false

[dependencies]
regex = "1.10"
lazy_static = "1.4"
av-ebpf-common = { path = "../av-ebpf-common", features = ["user"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"
fnv = "1.0"
thiserror = "1.0"
glob = "0.3"

[dev-dependencies]
tempfile = "3"
