[package]
name = "av-containers"
version = "0.1.0"
edition = "2021"
description = "Container and Kubernetes escape detection for WinnCore"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
thiserror = "1.0"
nix = { version = "0.27", features = ["process", "fs"] }
procfs = "0.16"
