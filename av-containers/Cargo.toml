[package]
name = "av-containers"
version = "0.1.0"
edition = "2021"
authors.workspace = true
license.workspace = true
description = "Container and Kubernetes escape detection for WinnCore"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/av-containers"
readme = "README.md"
keywords = ["security", "edr", "arm64", "antivirus", "containers"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
thiserror = "1.0"
nix = { version = "0.27", features = ["process", "fs"] }
procfs = "0.16"
