[package]
name = "av-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Core scanning primitives for WinnCoreAV (ARM64-native Linux EDR)"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/av-core"
readme = "README.md"
keywords = ["security", "edr", "arm64", "antivirus", "scanner"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
yara.workspace = true
chrono.workspace = true
url.workspace = true
semver.workspace = true
sha2.workspace = true
toml.workspace = true
thiserror.workspace = true
once_cell = "1.19"
goblin.workspace = true
async-trait.workspace = true
hostname = "0.3"
default-net = "0.21"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"], optional = true }
rand.workspace = true
parking_lot.workspace = true
getrandom = "0.2"
mimalloc = { version = "0.1", default-features = false, features = ["secure"] }
zeroize = { version = "1.7", features = ["derive"] }
libc = "0.2"

# ML detector (CRITICAL - was missing!)
av-ml-detector = { path = "../av-ml-detector", version = "0.1.0" }

[features]
default = ["telemetry-file"]
telemetry-file = []
telemetry-http = ["reqwest"]

[dev-dependencies]
tempfile = "3.10"
av-quarantine = { path = "../av-quarantine", version = "0.1.0" }
sysinfo = "0.30"
humantime = "2.1"
criterion = "0.5"

[[bench]]
name = "file_scanning"
harness = false

[[bench]]
name = "hash_performance"
harness = false
