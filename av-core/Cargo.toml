[package]
name = "av-core"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
yara.workspace = true
chrono.workspace = true
url.workspace = true
semver.workspace = true
sha2.workspace = true
toml.workspace = true
thiserror.workspace = true
once_cell = "1.19"
goblin.workspace = true
async-trait.workspace = true
hostname = "0.3"
default-net = "0.21"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"], optional = true }

# ML detector (CRITICAL - was missing!)
av-ml-detector = { path = "../av-ml-detector" }

[features]
default = ["telemetry-file"]
telemetry-file = []
telemetry-http = ["reqwest"]

[dev-dependencies]
tempfile = "3.10"
av-quarantine = { path = "../av-quarantine" }
sysinfo = "0.30"
humantime = "2.1"
criterion = "0.5"

[[bench]]
name = "file_scanning"
harness = false

[[bench]]
name = "hash_performance"
harness = false
