[package]
name = "av-daemon"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
description = "System daemon for WinnCoreAV real-time monitoring and response"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/av-daemon"
readme = "README.md"
keywords = ["security", "edr", "arm64", "antivirus", "daemon"]
categories = ["command-line-utilities", "development-tools"]

[features]
default = []
behavior_monitor = ["aya", "av-ebpf-loader"]

[dependencies]
winncore-monitor = { path = "../winncore-monitor", version = "0.1.0" }
av-core = { path = "../av-core", version = "0.1.0" }
av-behavioral = { path = "../av-behavioral", version = "0.1.0" }
av-ebpf-common = { path = "../av-ebpf-common", version = "0.1.0", features = ["user"] }
av-ebpf-detect = { path = "../av-ebpf-detect", version = "0.1.0" }
av-ebpf-loader = { path = "../av-ebpf-loader", version = "0.1.0", optional = true }
av-containers = { path = "../av-containers", version = "0.1.0" }
av-memory = { path = "../av-memory", version = "0.1.0" }
av-response = { path = "../av-response", version = "0.1.0" }
av-rootkit = { path = "../av-rootkit", version = "0.1.0" }
av-threatintel = { path = "../av-threatintel", version = "0.1.0" }
anyhow.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde.workspace = true
serde_json.workspace = true
toml = "0.8"
chrono.workspace = true
notify = "6.1"
inotify = { version = "0.10", default-features = false }
signal-hook = "0.3"
signal-hook-tokio = { version = "0.3", features = ["futures-v0_3"] }
daemonize = "0.5"
nix = { version = "0.27", features = ["signal"] }
config = "0.14"
tokio-stream = "0.1"
aya = { version = "0.13", optional = true, features = ["async_tokio"] }
bytes = "1.10"
sha2.workspace = true
hex.workspace = true
libc = "0.2"
parking_lot = "0.12"
prometheus = "0.13"
lazy_static = "1.4"
hyper = { version = "0.14", features = ["server", "tcp", "http1"] }
sd-notify = "0.4"
