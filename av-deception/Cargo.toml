[package]
name = "av-deception"
version = "0.1.0"
edition = "2021"
description = "Deception and canary file detection for WinnCore EDR"
publish = false

[dependencies]
libc = "0.2"
nix = "0.27"
inotify = "0.10"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.42", features = ["sync", "fs", "macros", "rt"] }
uuid = { version = "1", features = ["v4"] }
