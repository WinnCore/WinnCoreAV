[package]
name = "av-ebpf-common"
version = "0.1.0"
edition = "2021"
authors.workspace = true
license.workspace = true
description = "Shared types for WinnCore eBPF probes and userspace"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/av-ebpf-common"
readme = "README.md"
keywords = ["security", "edr", "arm64", "antivirus", "ebpf"]
categories = ["command-line-utilities", "development-tools"]

[features]
default = []
user = ["serde"]
bpf = []

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }
aya = { version = "0.12", optional = true }

[lib]
path = "src/lib.rs"
