[package]
name = "av-ebpf-detect"
version = "0.1.0"
edition = "2021"
authors.workspace = true
license.workspace = true
description = "eBPF rootkit detection for WinnCore EDR"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/av-ebpf-detect"
readme = "README.md"
keywords = ["security", "edr", "arm64", "antivirus", "rootkit"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
libc = "0.2"
nix = "0.27"
tracing = "0.1"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
