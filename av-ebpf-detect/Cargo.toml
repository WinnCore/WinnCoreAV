[package]
name = "av-ebpf-detect"
version = "0.1.0"
edition = "2021"
description = "eBPF rootkit detection for WinnCore EDR"
publish = false

[dependencies]
libc = "0.2"
nix = "0.27"
tracing = "0.1"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
