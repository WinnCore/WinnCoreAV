[package]
name = "av-ebpf-loader"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Userspace loader for WinnCoreAV eBPF probes"
documentation = "https://docs.rs/av-ebpf-loader"
readme = "README.md"
keywords = ["security", "edr", "arm64", "antivirus", "ebpf"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[dependencies]
aya = { version = "0.13", features = ["async_tokio"] }
aya-log = "0.2"
tokio = { version = "1", features = ["macros", "rt", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
libc = "0.2"
nix = { version = "0.27", features = ["user", "fs"] }

[build-dependencies]
libbpf-cargo = "0.22"
