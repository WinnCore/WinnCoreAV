[package]
name = "av-ebpf-probes"
version = "0.1.0"
edition = "2021"
description = "WinnCore eBPF probes for behavioral monitoring"
publish = false

[dependencies]
aya-ebpf = "0.1"
aya-log-ebpf = "0.1"
av-ebpf-common = { path = "../av-ebpf-common", features = ["bpf"], default-features = false }

[[bin]]
name = "winncore-ebpf"
path = "src/main.rs"

[profile.release]
panic = "abort"
lto = true
opt-level = "z"

[build]
target = "bpfel-unknown-none"
rustflags = ["-C", "link-arg=--btf"]
