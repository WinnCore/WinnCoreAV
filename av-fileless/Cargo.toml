[package]
name = "av-fileless"
version = "0.1.0"
edition = "2021"
authors.workspace = true
license.workspace = true
description = "Fileless malware detection for WinnCore EDR"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/av-fileless"
readme = "README.md"
keywords = ["security", "edr", "arm64", "antivirus", "fileless"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
libc = "0.2"
nix = "0.27"
tracing = "0.1"
procfs = "0.16"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
