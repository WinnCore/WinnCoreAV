[package]
name = "av-gui"
version = "0.1.0"
edition = "2021"
authors.workspace = true
license.workspace = true
description = "WinnCoreAV Desktop Interface"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/av-gui"
readme = "README.md"
keywords = ["security", "edr", "arm64", "antivirus", "gui"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = ["shell-open"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
notify = "6.0"
chrono = { version = "0.4", features = ["serde"] }

[features]
default = []
gui = ["custom-protocol"]
custom-protocol = ["dep:tauri", "tauri/custom-protocol"]

[[bin]]
name = "av-gui"
path = "src-tauri/src/main.rs"
required-features = ["gui"]
