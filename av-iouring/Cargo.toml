[package]
name = "av-iouring"
version = "0.1.0"
edition = "2021"
authors.workspace = true
license.workspace = true
description = "io_uring attack detection scaffolding for WinnCore"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/av-iouring"
readme = "README.md"
keywords = ["security", "edr", "arm64", "antivirus", "io-uring"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
libc = "0.2"
nix = { version = "0.27", features = ["process", "ptrace"] }
tracing = "0.1"
thiserror = "1.0"
procfs = "0.16"
serde = { version = "1.0", features = ["derive"] }
parking_lot = "0.12"
