[package]
name = "av-mitre-tests"
version = "0.1.0"
edition = "2021"
description = "MITRE ATT&CK test suite for WinnCore EDR validation"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
tracing = "0.1"
tokio = { version = "1.42", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
nix = "0.27"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[[bin]]
name = "mitre-test-runner"
path = "src/runner.rs"
