[package]
name = "av-mitre-tests"
version = "0.1.0"
edition = "2021"
authors.workspace = true
license.workspace = true
description = "MITRE ATT&CK test suite for WinnCore EDR validation"
publish = false
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/av-mitre-tests"
readme = "README.md"
keywords = ["security", "edr", "arm64", "antivirus", "mitre"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
tracing = "0.1"
tokio = { version = "1.42", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
nix = "0.27"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[[bin]]
name = "mitre-test-runner"
path = "src/runner.rs"
