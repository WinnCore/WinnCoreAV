[package]
name = "av-ml-detector"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
log = "0.4"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# ML inference - use ndarray version that matches ort
ort = "2.0.0-rc.10"
ndarray = "0.16"

# ELF parsing
goblin = "0.8"

# Feature extraction
sha2 = "0.10"
ed25519-dalek = "2.1"
semver = { version = "1.0", features = ["serde"] }

# Instruction analysis
capstone = "0.12"

[dev-dependencies]
tempfile = "3"
