[package]
name = "av-ml-detector"
version = "0.1.0"
edition = "2021"
authors.workspace = true
license.workspace = true
description = "ML-based malware scoring and feature extraction for WinnCoreAV"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/av-ml-detector"
readme = "README.md"
keywords = ["security", "edr", "arm64", "antivirus", "ml"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"

# ML inference - use ndarray version that matches ort
ort = "2.0.0-rc.10"
ndarray = "0.16"

# ELF parsing
goblin = "0.8"

# Feature extraction
sha2 = "0.10"
ed25519-dalek = "2.1"
semver = { version = "1.0", features = ["serde"] }

# Instruction analysis
capstone = "0.12"

[dev-dependencies]
tempfile = "3"
