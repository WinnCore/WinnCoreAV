[package]
name = "av-response"
version = "0.1.0"
edition = "2021"
description = "Automated response actions for WinnCore"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
thiserror = "1.0"
tokio = { version = "1", features = ["process", "fs", "sync"] }
nix = { version = "0.27", features = ["signal", "process"] }
ipnetwork = "0.20"
chrono = { version = "0.4", features = ["serde"] }
