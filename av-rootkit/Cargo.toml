[package]
name = "av-rootkit"
version = "0.1.0"
edition = "2021"
authors.workspace = true
license.workspace = true
description = "Rootkit and kernel tampering detection for WinnCore"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/av-rootkit"
readme = "README.md"
keywords = ["security", "edr", "arm64", "antivirus", "rootkit"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
thiserror = "1.0"
procfs = "0.16"
glob = "0.3"
