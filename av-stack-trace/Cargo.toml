[package]
name = "av-stack-trace"
version = "0.1.0"
edition = "2021"
authors.workspace = true
license.workspace = true
description = "Stack trace validation for direct syscall detection"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/av-stack-trace"
readme = "README.md"
keywords = ["security", "edr", "arm64", "antivirus", "stacktrace"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
libc = "0.2"
nix = { version = "0.27", features = ["process", "ptrace"] }
tracing = "0.1"
procfs = "0.16"
serde = { version = "1.0", features = ["derive"] }
object = "0.32"
memmap2 = "0.9"
