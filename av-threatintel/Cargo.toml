[package]
name = "av-threatintel"
version = "0.1.0"
edition = "2021"
authors.workspace = true
license.workspace = true
description = "Threat intelligence integration for WinnCore"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/av-threatintel"
readme = "README.md"
keywords = ["security", "edr", "arm64", "antivirus", "threatintel"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
thiserror = "1.0"
tokio = { version = "1", features = ["fs"] }
sha2 = "0.10"
hex = "0.4"
ipnetwork = "0.20"
