# WinnCoreAV Daemon Configuration

[metrics]
enabled = true
port = 9090

[response]
enabled = true
auto_kill_critical = false
auto_quarantine = true
quarantine_threshold = 0.85
quarantine_dir = "/var/lib/winncore/quarantine"

[behavioral]
external_rules_dir = "/etc/winncore/rules"
alert_log_path = "/var/log/winncore/behavioral_alerts.jsonl"

# Threat intelligence configuration
[threat_intel]
enabled = false
db_path = "/var/lib/winncore/threatintel"
min_confidence = 0
subdomain_matching = true

# Example TAXII feed (API key in env var)
[[threat_intel.feeds]]
name = "taxii-demo"
feed_type = "taxii"
enabled = false
update_interval_mins = 60
config = { server_url = "https://taxii.example.com", api_root = "api", collection_id = "collection-id", api_key_env = "WINNCORE_TAXII_API_KEY", timeout_secs = 30, page_size = 100 }

# Example MISP feed
[[threat_intel.feeds]]
name = "misp-demo"
feed_type = "misp"
enabled = false
update_interval_mins = 60
config = { url = "https://misp.example.com", api_key_env = "WINNCORE_MISP_API_KEY", verify_ssl = true, timeout_secs = 30, last_days = 7 }

# Example VirusTotal on-demand enrichment
[[threat_intel.feeds]]
name = "virustotal-demo"
feed_type = "virus_total"
enabled = false
update_interval_mins = 120
config = { api_key_env = "WINNCORE_VT_API_KEY", rate_limit = 4, timeout_secs = 30, hashes = [], domains = [], ips = [] }

# SIEM Integration Configuration
[siem]
enabled = true
local_log = true
# Last-resort local buffer when no outputs deliver.
buffer_path = "/var/log/winncore/alerts-buffer.jsonl"

# Syslog output
[[siem.outputs]]
type = "syslog"
name = "primary_syslog"
enabled = true
address = "10.0.0.50:514"
transport = "udp" # udp, tcp, tcp_tls
format = "cef"    # json, cef, leef
min_severity = "low"

# Splunk HEC output
[[siem.outputs]]
type = "webhook"
name = "splunk_hec"
enabled = false
url = "https://splunk.example.com:8088/services/collector/event"
auth_type = "splunk_hec"
auth_token = "${SPLUNK_HEC_TOKEN}"
format = "json"
min_severity = "medium"
batch_size = 100
batch_timeout_secs = 5

# Elastic output
[[siem.outputs]]
type = "webhook"
name = "elastic"
enabled = false
url = "https://elastic.example.com:9200/winncore-alerts/_doc"
auth_type = "bearer"
auth_token = "${ELASTIC_API_KEY}"
format = "json"
min_severity = "low"

# Custom webhook
[[siem.outputs]]
type = "webhook"
name = "custom_webhook"
enabled = false
url = "https://security.example.com/api/alerts"
auth_type = "bearer"
auth_token = "${WEBHOOK_TOKEN}"
format = "json"
min_severity = "high"

# File output (JSON lines)
[[siem.outputs]]
type = "file"
name = "local_jsonl"
enabled = true
path = "/var/log/winncore/alerts.jsonl"
format = "json"
min_severity = "info"
rotate_size_mb = 100
rotate_keep = 10
