# cargo-deny configuration for WinnCoreAV
# Updated for cargo-deny 0.16.0+ (deprecated fields removed)

[graph]
targets = [
    { triple = "aarch64-unknown-linux-gnu" }
]
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
version = 2
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8

# Use allow list (replaces old deny/copyleft/default)
allow = [
    "Unicode-3.0",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Unlicense",
    "0BSD",
]

# Licenses to reject (instead of old deny = [...])
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 }
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
