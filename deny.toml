# cargo-deny configuration for WinnCoreAV

[graph]
targets = [
    { triple = "aarch64-unknown-linux-gnu" }
]
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
version = 2
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",           # Used by icu_* crates (unicode processing)
    "Unicode-DFS-2016",      # Unicode Data Files
    "CC0-1.0",               # Used by notify crate
    "MPL-2.0",               # Used by option-ext
    "0BSD",                  # Zero-clause BSD
    "Zlib",                  # Zlib license
    "BSL-1.0",               # Boost Software License
    "GPL-2.0-only",          # For bloom crate
    "LGPL-2.1-only",         # For seccomp crates
]

# Map deprecated SPDX identifiers to modern equivalents
[[licenses.clarify]]
name = "bloom"
version = "0.3.2"
expression = "GPL-2.0-only"
license-files = []

[[licenses.clarify]]
name = "seccomp"
version = "0.1.2"
expression = "LGPL-2.1-only"
license-files = []

[[licenses.clarify]]
name = "seccomp-sys"
version = "0.1.3"
expression = "LGPL-2.1-only"
license-files = []

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 }
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
