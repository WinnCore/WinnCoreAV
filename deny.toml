# cargo-deny configuration for WinnCoreAV

[graph]
targets = [
    { triple = "aarch64-unknown-linux-gnu" }
]
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
version = 2
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
unlicensed = "deny"
copyleft = "deny"
allow = ["MIT","Apache-2.0","BSD-3-Clause","BSD-2-Clause","ISC","Zlib","0BSD","GPL-2.0-only","LGPL-2.1-only"]

# Map deprecated SPDX identifiers to modern equivalents
[[licenses.clarify]]
name = "bloom"
version = "0.3.2"
expression = "GPL-2.0-only"
license-files = []

[[licenses.clarify]]
name = "seccomp"
version = "0.1.2"
expression = "LGPL-2.1-only"
license-files = []

[[licenses.clarify]]
name = "seccomp-sys"
version = "0.1.3"
expression = "LGPL-2.1-only"
license-files = []

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 }
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
