[package]
name = "winncore-monitor"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Realtime file monitoring and scanning runtime for WinnCoreAV"
documentation = "https://docs.rs/winncore-monitor"
readme = "README.md"
keywords = ["security", "edr", "arm64", "antivirus", "monitoring"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[dependencies]

anyhow.workspace = true
av-core = { path = "../av-core", version = "0.1.0" }
# TODO: add dependency for crossbeam_channel
# TODO: add dependency for filetime
# TODO: add dependency for glob
# TODO: add dependency for lru_time_cache
notify = "6.1"
# TODO: add dependency for notify_rust
tokio = { workspace = true, features = ["full"] }
# TODO: add dependency for sha2
tracing.workspace = true
serde_json.workspace = true
# TODO: add dependency for chrono
# TODO: add dependency for libc
# TODO: add dependency for num_cpus
# TODO: add dependency for dirs
# TODO: add dependency for ctrlc
# TODO: add dependency for hex
crossbeam-channel = "0.5"
filetime = "0.2"
glob = "0.3"
lru_time_cache = "0.11"
notify-rust = "4"
sha2 = "0.10"
chrono = "0.4"
libc = "0.2"
num_cpus = "1.16"
dirs = "5"
ctrlc = "3"
hex = "0.4"
